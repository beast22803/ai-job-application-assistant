name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main  # Adjust this if your default branch is master or dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Next.js
        env:
          # Backend base URL baked into the static site. Defaults to the Render backend;
          # set the repository variable API_URL (Settings > Secrets and variables >
          # Actions > Variables) to point the site somewhere else.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://ai-job-application-backend-intl.onrender.com' }}
        run: npm run build
        working-directory: ./frontend

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional Fly.io backend deploy. Skipped unless the repository variable DEPLOY_FLY is
  # set to "true" (the Fly trial ended, so deploys fail until a card is added).
  deploy-backend:
    if: ${{ vars.DEPLOY_FLY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -c fly.toml
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
